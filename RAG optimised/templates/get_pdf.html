<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Upload Document | AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/static/css/background.css">
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #eaeaea;
      --accent: #10a37f;
      --card-bg: #1e1e1e;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Hero Section Styles */
    .hero-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 1400px;
      /* Increased from 1200px */
      gap: 8rem;
      /* Increased from 4rem */
      z-index: 10;
    }

    .hero-text {
      flex: 1;
      max-width: 600px;
      animation: slideInLeft 0.8s ease-out;
    }

    .hero-text h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      font-size: 1.2rem;
      color: #b0b0b0;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Stats or details if needed */
    .hero-stats {
      display: flex;
      gap: 2rem;
      margin-top: 2rem;
    }

    .stat-item h3 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .stat-item span {
      font-size: 0.9rem;
      color: #888;
    }

    /* Upload Card Styles - Modified for Layout */
    .hero-card-wrapper {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      animation: slideInRight 0.8s ease-out;
    }

    .upload-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: all 0.3s ease;
      /* Animation removed */
    }

    .upload-card.drag-active {
      background: rgba(255, 255, 255, 0.1);
      border-color: #10a37f;
      box-shadow: 0 0 40px rgba(16, 163, 127, 0.4);
      transform: scale(1.02);
    }

    /* Keyframes pulse-border removed */

    .upload-card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      margin-top: 0;
    }

    .upload-card p {
      color: #888;
      margin-bottom: 2rem;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 50%;
    }

    input[type="file"] {
      width: 100%;
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      margin-bottom: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    input[type="file"]:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    input[type="file"]::file-selector-button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      margin-right: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    input[type="file"]::file-selector-button:hover {
      background: #0d8a6c;
      transform: translateY(-1px);
    }

    button {
      background: linear-gradient(135deg, var(--accent) 0%, #0d8a6c 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      width: 100%;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 163, 127, 0.4);
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #666;
    }

    /* Animations */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        justify-content: flex-start;
      }

      .hero-container {
        flex-direction: column;
        justify-content: flex-start;
        padding: 4rem 1.5rem;
        gap: 3rem;
        height: auto;
        min-height: 100vh;
      }

      .hero-text {
        text-align: center;
        max-width: 100%;
        margin-top: 2rem;
      }

      .hero-text h1 {
        font-size: 2.8rem;
      }

      .hero-stats {
        justify-content: center;
      }

      .hero-card-wrapper {
        justify-content: center;
        width: 100%;
        margin-bottom: 3rem;
      }
    }

    @media (max-width: 600px) {
      .hero-container {
        padding: 3rem 1rem;
        gap: 2rem;
      }

      .hero-text h1 {
        font-size: 2.2rem;
        line-height: 1.2;
      }

      .hero-text p {
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }

      .hero-stats {
        justify-content: center;
        gap: 2.5rem;
      }

      .stat-item h3 {
        font-size: 1.3rem;
      }

      .upload-card {
        padding: 1.5rem;
        border-radius: 20px;
      }

      .upload-card h2 {
        font-size: 1.5rem;
      }

      .icon {
        font-size: 2.5rem;
        padding: 0.8rem;
      }

      button {
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
      }
    }
  </style>
</head>


<body>
  <canvas id="bg-canvas"></canvas>

  <main class="hero-container">
    <!-- Left: Text Section -->
    <section class="hero-text">
      <h1>Unlock Knowledge<br>from Your Documents</h1>
      <p>Seamlessly upload your docs and get instant, intelligent answers powered by
        RAG.</p>

      <div class="hero-stats">
        <div class="stat-item">
          <h3>Fast</h3>
          <span>Processing</span>
        </div>
        <div class="stat-item">
          <h3>Smart</h3>
          <span>Insights</span>
        </div>
      </div>
    </section>

    <!-- Right: Upload Section -->
    <section class="hero-card-wrapper">
      <div class="upload-card">
        <div class="icon">📄</div>
        <h2>Upload Document</h2>
        <p>Select a file to begin</p>
        <form id="uploadForm" action="/get_pdf" method="post" enctype="multipart/form-data">
          <input type="file" id="pdfInput" name="file_upload" accept=".pdf,.docx,.txt,.md" required />
          <button type="submit">Submit</button>
        </form>
        <div class="hint">Press <strong>Ctrl + U</strong> to browse<br><strong>Enter</strong> to submit</div>
      </div>
    </section>
  </main>

  <script>

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        document.getElementById('pdfInput').click();
      } else if (e.key === 'Enter') {
        // Only submit if not in a text input (though here we only have file input)
        const active = document.activeElement.tagName.toLowerCase();
        if (active !== 'input' && active !== 'textarea' && active !== 'button') {
          document.getElementById('uploadForm').submit();
        }
      }
    });

    // Drag and Drop Logic
    const dropZone = document.querySelector('.upload-card');
    const fileInput = document.getElementById('pdfInput');
    const uploadForm = document.getElementById('uploadForm');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, unhighlight, false);
    });

    function highlight(e) {
      dropZone.classList.add('drag-active');
    }

    function unhighlight(e) {
      dropZone.classList.remove('drag-active');
    }

    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;

      if (files.length > 0) {
        fileInput.files = files;
        // Optional: Auto submit or just show it's selected
        // Let's auto-submit for "fluid" feel
        uploadForm.submit();
      } else {
        alert("Please drop a valid file.");
      }
    }
  </script>
  <script type="module" src="/static/js/space_scene.js?v=4"></script>
</body>

</html>
