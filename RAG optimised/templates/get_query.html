<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ask Document | AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <link rel="stylesheet" href="/static/css/background.css">
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #eaeaea;
      --accent: #10a37f;
      --card-bg: #1e1e1e;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Hero Section Styles */
    .hero-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 1400px;
      gap: 8rem;
      z-index: 10;
    }

    .hero-text {
      flex: 1;
      max-width: 600px;
      animation: slideInLeft 0.8s ease-out;
    }

    .hero-text h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      font-size: 1.2rem;
      color: #b0b0b0;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Stats or details if needed */
    .hero-stats {
      display: flex;
      gap: 4rem;
      margin-top: 3rem;
    }

    .stat-item h3 {
      margin: 0;
      margin-bottom: 0.3rem;
      font-size: 1.8rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-item span {
      display: block;
      font-size: 0.95rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Glass Card Styles */
    .hero-card-wrapper {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      animation: slideInRight 0.8s ease-out;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .file-info {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      display: inline-block;
    }

    form {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    textarea {
      flex: 1;
      padding: 1rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border 0.3s, background 0.3s;
      resize: vertical;
      min-height: 60px;
      max-height: 200px;
      font-family: inherit;
    }

    textarea:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.4);
    }

    input::placeholder {
      color: #666;
    }

    button {
      background: linear-gradient(135deg, var(--accent) 0%, #0d8a6c 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 1rem 1.4rem;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 163, 127, 0.4);
    }

    .reupload {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #666;
    }

    .reupload a {
      color: var(--accent);
      text-decoration: none;
      margin-left: 5px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .reupload a:hover {
      color: #0d8a6c;
      text-decoration: underline;
    }




    /* Animations */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        justify-content: flex-start;
      }

      .hero-container {
        flex-direction: column;
        justify-content: flex-start;
        padding: 4rem 1.5rem;
        gap: 3rem;
        height: auto;
        min-height: 100vh;
      }

      .hero-text {
        text-align: center;
        max-width: 100%;
        margin-top: 2rem;
      }

      .hero-text h1 {
        font-size: 2.8rem;
      }

      .hero-stats {
        justify-content: center;
      }

      .hero-card-wrapper {
        justify-content: center;
        width: 100%;
        margin-bottom: 3rem;
      }
    }

    @media (max-width: 600px) {
      .hero-container {
        padding: 3rem 1rem;
        gap: 2rem;
      }

      .hero-text h1 {
        font-size: 2.2rem;
        line-height: 1.2;
      }

      .hero-text p {
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }

      .hero-stats {
        justify-content: center;
        gap: 2.5rem;
      }

      .stat-item h3 {
        font-size: 1.3rem;
      }

      .glass-card {
        padding: 1.5rem;
        border-radius: 20px;
      }

      button {
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
      }

      textarea {
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>


<body>
  <canvas id="bg-canvas"></canvas>

  <main class="hero-container">
    <!-- Left: Text Section -->
    <section class="hero-text">
      <p>I've analyzed <strong>{{ file_name }}</strong>. Ask me anything about its contents, summaries, or specific
        details.</p>

      <div class="hero-stats">
        <div class="stat-item">
          <h3>Ready</h3>
          <span>To Answer</span>
        </div>
        <div class="stat-item">
          <h3>Context</h3>
          <span>Aware</span>
        </div>
      </div>
    </section>

    <!-- Right: Query Section -->
    <section class="hero-card-wrapper">
      <div class="glass-card">

        <form action="/get_user_query" method="post" id="queryForm">
          <input type="hidden" name="file_name" value="{{ file_name }}">
          <textarea id="queryInput" name="query" placeholder="Ask you Query..." required
            oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
          <button type="submit">➤</button>
        </form>

        <div class="reupload">
          Need another file?
          <a href="/">Upload a new Document</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === "r") {
        e.preventDefault();
        window.location.href = "/";
      } else if (e.key === "Enter") {
        const active = document.activeElement;
        if (active.id !== "queryInput") return;
        document.getElementById("queryForm").submit();
      }
    });
  </script>
  <script type="module" src="/static/js/space_scene.js?v=4"></script>
</body>

</html>
